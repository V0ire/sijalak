[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jalak-backend"
version = "0.1.0"
description = "Offline-testable credential-free core for the Si Jalak Bedas voice gateway"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["jalak_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
